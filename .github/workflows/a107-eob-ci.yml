name: A107-EOB — Build e testes

on:
  pull_request:
    branches: [main]
    paths:
      - "plataforma/a107-eob/**"
      - ".github/workflows/a107-eob-ci.yml"
      - ".gitattributes"
  push:
    branches: [main, "feature/a107-eob-v0.2.0", "feature/a107-ce01-a103-v0.1"]
    paths:
      - "plataforma/a107-eob/**"
      - ".github/workflows/a107-eob-ci.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node.js 24 — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plataforma/a107-eob
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plataforma/a107-eob/package-lock.json

      - name: Verificar LF dos arquivos de regras (integridade por bytes)
        shell: bash
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const rules = "rules";
            for (const name of readdirSync(rules)) {
              if (!name.endsWith(".md") && !name.endsWith(".json")) continue;
              const bytes = readFileSync(`${rules}/${name}`);
              for (let i = 0; i < bytes.length - 1; i++) {
                if (bytes[i] === 13 && bytes[i + 1] === 10) {
                  console.error(`Arquivo com CRLF: ${name}`);
                  process.exitCode = 1;
                  break;
                }
              }
            }
          '

      - name: Instalação reproduzível
        run: npm ci

      - name: Compilação TypeScript
        run: npm run build

      - name: Testes automatizados sem PostgreSQL
        run: npm test

# test:integration é intencionalmente excluído: exige banco local isolado,
# credenciais de teste e pacote MARCO_A previamente publicado.
